<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spoken Light - OBS Lower-Third Overlay</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .caption-container {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      max-width: 1200px;
      text-align: center;
    }
    .caption-text {
      display: inline-block;
      background: rgba(9, 13, 22, 0.85);
      color: #ffffff;
      font-size: 2.2rem;
      font-weight: 600;
      line-height: 1.4;
      padding: 16px 32px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      min-height: 2.2rem;
    }
    .fade-out {
      opacity: 0;
      transform: translateY(10px);
    }
  </style>
</head>
<body>
  <div class="caption-container">
    <div id="captionText" class="caption-text fade-out"></div>
  </div>

  <script>
    const captionText = document.getElementById('captionText');
    let fadeTimer = null;

    function connectWebSocket() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${protocol}//${location.host}/api/ws`);

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'caption' && data.text) {
            captionText.innerText = data.text;
            captionText.classList.remove('fade-out');

            clearTimeout(fadeTimer);
            fadeTimer = setTimeout(() => {
              captionText.classList.add('fade-out');
            }, 6000);
          }
        } catch (e) {
          console.error('Error handling overlay caption:', e);
        }
      };

      ws.onclose = () => {
        setTimeout(connectWebSocket, 2000);
      };
    }

    connectWebSocket();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spoken Light - OBS Livestream Overlay</title>
  <style>
    :root {
      --font-size-active: 2.25rem;
      --font-size-mid: 1.70rem;
      --font-size-top: 1.35rem;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: transparent !important;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      width: 100vw;
      height: 100vh;
    }
    .caption-container {
      position: absolute;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 1400px;
      text-align: center;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    /* Scripture Lower-Third Badge */
    .scripture-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.94);
      color: #fbbf24;
      border: 1px solid rgba(251, 191, 36, 0.5);
      border-radius: 24px;
      padding: 6px 18px;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8), 0 0 20px rgba(245, 158, 11, 0.25);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 0;
      transform: translateY(12px);
    }
    .scripture-badge.visible {
      opacity: 1;
      transform: translateY(0);
    }
    /* 3-Line Caption Card */
    .caption-card {
      display: inline-flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(6, 10, 18, 0.92);
      padding: 24px 38px;
      border-radius: 18px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      max-width: 100%;
      min-width: 480px;
    }
    .caption-line {
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      line-height: 1.35;
      letter-spacing: 0.015em;
    }
    .line-top {
      color: rgba(203, 213, 225, 0.35);
      font-size: var(--font-size-top);
      font-weight: 500;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
    }
    .line-mid {
      color: rgba(226, 232, 240, 0.70);
      font-size: var(--font-size-mid);
      font-weight: 600;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
    }
    .line-active {
      color: #ffffff;
      font-size: var(--font-size-active);
      font-weight: 800;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95);
    }
    .fade-out {
      opacity: 0 !important;
      transform: translateY(16px) !important;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="caption-container">
    <!-- POPUP SCRIPTURE ANCHOR BADGE -->
    <div id="scriptureBadge" class="scripture-badge">
      <span>📖</span>
      <span id="scriptureText">John 3:16</span>
    </div>

    <!-- ROLLING 3-LINE CAPTION CARD -->
    <div id="captionCard" class="caption-card fade-out">
      <div id="lineTop" class="caption-line line-top hidden"></div>
      <div id="lineMid" class="caption-line line-mid hidden"></div>
      <div id="lineActive" class="caption-line line-active"></div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const persistSeconds = parseInt(urlParams.get('persist') || '18', 10);
    const persistMs = Math.max(4000, persistSeconds * 1000);

    const captionCard = document.getElementById('captionCard');
    const lineTop = document.getElementById('lineTop');
    const lineMid = document.getElementById('lineMid');
    const lineActive = document.getElementById('lineActive');
    const scriptureBadge = document.getElementById('scriptureBadge');
    const scriptureText = document.getElementById('scriptureText');

    let fadeTimer = null;
    let scriptureBadgeTimer = null;
    let ws = null;
    let sentenceStack = [];

    function renderStack() {
      if (sentenceStack.length === 0) {
        clearCaptions();
        return;
      }

      if (sentenceStack.length === 1) {
        lineTop.classList.add('hidden');
        lineMid.classList.add('hidden');
        lineActive.innerText = sentenceStack[0];
      } else if (sentenceStack.length === 2) {
        lineTop.classList.add('hidden');
        lineMid.classList.remove('hidden');
        lineMid.innerText = sentenceStack[0];
        lineActive.innerText = sentenceStack[1];
      } else {
        lineTop.classList.remove('hidden');
        lineTop.innerText = sentenceStack[0];
        lineMid.classList.remove('hidden');
        lineMid.innerText = sentenceStack[1];
        lineActive.innerText = sentenceStack[2];
      }

      captionCard.classList.remove('fade-out');

      if (fadeTimer) clearTimeout(fadeTimer);
      fadeTimer = setTimeout(() => {
        captionCard.classList.add('fade-out');
      }, persistMs);
    }

    function clearCaptions() {
      if (fadeTimer) {
        clearTimeout(fadeTimer);
        fadeTimer = null;
      }
      captionCard.classList.add('fade-out');
      setTimeout(() => {
        if (captionCard.classList.contains('fade-out')) {
          sentenceStack = [];
          lineActive.innerText = "";
          lineMid.innerText = "";
          lineTop.innerText = "";
          lineMid.classList.add('hidden');
          lineTop.classList.add('hidden');
        }
      }, 500);
    }

    function pushCaption(text) {
      if (!text || text.trim().length === 0) return;
      const clean = text.trim();

      if (sentenceStack.length > 0 && sentenceStack[sentenceStack.length - 1] === clean) {
        return;
      }

      sentenceStack.push(clean);
      if (sentenceStack.length > 3) {
        sentenceStack.shift();
      }

      renderStack();
    }

    function showScriptureBadge(ref) {
      if (!ref) return;
      scriptureText.innerText = ref;
      scriptureBadge.classList.add('visible');

      if (scriptureBadgeTimer) clearTimeout(scriptureBadgeTimer);
      scriptureBadgeTimer = setTimeout(() => {
        scriptureBadge.classList.remove('visible');
      }, 12000); // Display scripture badge for 12 seconds
    }

    function connectWebSocket() {
      if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}/api/ws`);

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'caption' && data.text) {
            pushCaption(data.text);
          } else if (data.type === 'clear') {
            clearCaptions();
          } else if (data.type === 'mode_change' && data.mode === 'worship') {
            clearCaptions();
          } else if (data.type === 'scripture_detected' && data.reference) {
            showScriptureBadge(data.reference);
          }
        } catch (e) {
          console.error('Error handling overlay message:', e);
        }
      };

      ws.onerror = () => {
        if (ws) {
          try { ws.close(); } catch(e) {}
        }
      };

      ws.onclose = () => {
        ws = null;
        setTimeout(connectWebSocket, 2000);
      };
    }

    connectWebSocket();
  </script>
</body>
</html>
